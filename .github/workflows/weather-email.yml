name: Daily weather email

on:
  schedule:
    # 05:53 UTC+8 == 21:53 UTC (previous day)
    - cron: '53 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-weather-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libcurl4-openssl-dev

      - name: Build weather
        run: |
          cmake -S . -B build
          cmake --build build -j2

      - name: Fetch weather
        run: |
          ./build/weather/weather > weather_output.txt 2>&1 || true
          cat weather_output.txt

      - name: Diagnose SMTP (temporary)
        continue-on-error: true
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          echo "== runner public IP =="
          curl -s https://ipinfo.io/ | head -c 400; echo
          echo "== smtp.163.com probes =="
          python3 - <<'PY'
          import smtplib, os
          u = os.environ["SMTP_USERNAME"]
          p = os.environ["SMTP_PASSWORD"]
          for port, mode in [(465, "ssl"), (994, "ssl"), (587, "starttls"), (25, "plain")]:
              try:
                  if mode == "ssl":
                      s = smtplib.SMTP_SSL("smtp.163.com", port, timeout=20)
                  else:
                      s = smtplib.SMTP("smtp.163.com", port, timeout=20)
                      s.ehlo()
                      if mode == "starttls":
                          s.starttls(); s.ehlo()
                  s.login(u, p)
                  print("port %s %s: LOGIN OK" % (port, mode))
                  s.quit()
              except Exception as e:
                  print("port %s %s: FAIL %s: %s" % (port, mode, type(e).__name__, e))
          PY

      - name: Resolve subject and body
        id: msg
        shell: bash
        run: |
          echo "subject=復旦天氣 $(TZ=Asia/Shanghai date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          DELIM="GH_OUT_EOF_$(date +%s%N)"
          printf 'body<<%s\n' "$DELIM" >> "$GITHUB_OUTPUT"
          cat weather_output.txt >> "$GITHUB_OUTPUT"
          printf '%s\n' "$DELIM" >> "$GITHUB_OUTPUT"

      - name: Send email
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ secrets.SMTP_USERNAME }}
          to: ${{ secrets.EMAIL_RECIPIENTS }}
          cc: ${{ secrets.EMAIL_CC }}
          subject: ${{ steps.msg.outputs.subject }}
          body: ${{ steps.msg.outputs.body }}
          ignore_cert: false