name: Daily weather email

on:
  schedule:
    # 05:53 UTC+8 == 21:53 UTC (previous day)
    - cron: '53 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-weather-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libcurl4-openssl-dev

      - name: Build weather
        run: |
          cmake -S . -B build
          cmake --build build -j2

      - name: Fetch weather
        run: |
          ./build/weather/weather > weather_output.txt 2>&1 || true
          cat weather_output.txt

      - name: Resolve subject
        id: msg
        shell: bash
        run: echo "subject=復旦天氣 $(TZ=Asia/Shanghai date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Send email
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          EMAIL_CC: ${{ secrets.EMAIL_CC }}
          SUBJECT: ${{ steps.msg.outputs.subject }}
        run: |
          python3 - <<'PY'
          import os, smtplib, ssl
          from email.message import EmailMessage
          from email.utils import formatdate

          def addrs(value):
              return [a.strip() for a in value.replace(",", "\n").split("\n") if a.strip()]

          host = os.environ["SMTP_SERVER"]
          port = int(os.environ["SMTP_PORT"])
          user = os.environ["SMTP_USERNAME"]
          password = os.environ["SMTP_PASSWORD"]
          to = addrs(os.environ["EMAIL_RECIPIENTS"])
          cc = addrs(os.environ.get("EMAIL_CC", ""))
          if not to:
              raise SystemExit("no recipients")

          msg = EmailMessage()
          msg["From"] = user
          msg["To"] = ", ".join(to)
          if cc:
              msg["Cc"] = ", ".join(cc)
          msg["Subject"] = os.environ["SUBJECT"]
          msg["Date"] = formatdate(localtime=True)
          msg.set_content(open("weather_output.txt", encoding="utf-8").read())

          ctx = ssl.create_default_context()
          if port == 465:
              s = smtplib.SMTP_SSL(host, port, context=ctx, timeout=30)
          else:
              s = smtplib.SMTP(host, port, timeout=30)
              s.starttls(context=ctx)
          try:
              s.login(user, password)
              s.send_message(msg)
          finally:
              s.quit()
          print("Mail sent to", ", ".join(to + cc))
          PY